<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Website Analysis Platform{% endblock %}</title>
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/markdown.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🔍 Website Analyzer</div>
            <div class="nav-links">
                {% if user %}
                    <span class="user-email">{{ user.email }}</span>
                    <a href="/logout" class="btn btn-logout">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    {% block content %}{% endblock %}

    <!-- Core JS (Always Load) -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/services/storage.js"></script>
    <script src="/static/js/services/analytics.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
    
    <!-- Page-Specific JS -->
    {% if 'chat' in request.url.path %}
        <script src="/static/js/markdown.js"></script>
        <script src="/static/js/chat.js"></script>
    {% elif 'login' in request.url.path or 'register' in request.url.path %}
        <script src="/static/js/auth.js"></script>
    {% elif 'analysis' in request.url.path %}
        <script src="/static/js/analysis-auto-update.js"></script>
    {% endif %}
</body>
</html>
